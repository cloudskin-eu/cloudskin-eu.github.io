  artifacts:
    - title: Lithops Serve
      description: An open source framework for big data analytics and embarrassingly parallel jobs, that provides an universal API for building parallel applications in the cloud.
      link: "https://github.com/ZikBurns/lithopserve"
    - title: Data-connector 
      description: Open-source software data-connector as an agent framework for smart and autonomous management.
      link: "https://github.com/bsc-scanflow/scanflow"
    - title: Generic Ephemeral Data Store (GEDS) 
      description: GEDS implements the efficient caching and exchange of ephemeral data using the load/store semantics of an object store.
      link: "https://github.com/IBM/GEDS"
    - title: ConfidentialQuark 
      description: Equipping prominent fields such as Artificial Intelligence and serverless computing with a confidential approach would be essential for various use cases in the future.
      link: "https://github.com/QuarkContainer/Quark/tree/cc_quark_amd_sev_snp"
    - title: NearbyOne v2.0 
      description: NearbyOne platform carries intra- and inter-domain orchestration capabilities and addresses the problem of xNF (CNF, VNF, etc.), as well as application orchestration in the cloud continuum.
      link: " https://github.com/cloudskin-eu/Mobility-use-case/tree/main/NearbyBlocks"
    - title: Agricultural Dataspace 
      description: Data space for agriculture is capable of attracting data providers, to whom it offers mechanisms of reliability and use of information, capable of starting the generation around this platfotm.
      link: "https://cloudskin.alternatecno.es/dataspace.html"
    - title: Surgical Navigation 
      description: Surgical navigation, where segmentation, 3D mapping, and other extracted features are combined with pre-operative models to provide visual guideance.
      link: "#"
    - title: Pravega
      description: Pravega is a tiered storage system for data streams that is at the core of Dell Streaming Data Platform (SDP) product.
      link: "https://github.com/pravega/pravega"
    - title: C-Cells 
      description: We have developed scheduling and orchestration policies and live migration of C-Cells in Faabric.
      link: "https://github.com/faasm/faabric"
    - title: Glider 
      description: Glider ephemeral storage system with in-storage computation.
      link: "https://github.com/CLOUDLAB-URV/glider-store"

