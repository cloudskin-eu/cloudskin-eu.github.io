objectives:
  text1: |
    **CloudSkin** aims to create a cognitive cloud-edge continuum platform that optimally exploits heterogeneous resources. Using AI, the platform will automatically adapt to application behavior and enable secure, seamless service deployment through a universal execution abstraction based on WebAssembly.
  image:
  text2: |
    **Goals**
    
    *   **Smart management for the Cloud-edge continuum:** Develop an AI-based “Learning Plane” to automatically orchestrate cloud and edge resources. Decisions will continuously adapt to the environment, including on low-power edge devices.
    *   **Virtual execution for the Cloud-edge continuum:** Create a universal execution abstraction (“Cloud-edge cells”) based on WebAssembly. It will enable efficient execution and migration of applications across the cloud-edge continuum, integrated with Kubernetes.
    *   **Infrastructure support for the Cloud-edge continuum:** Build a flexible infrastructure that supports very short-lived tasks and intense data bursts. It will provide near bare-metal performance using RDMA networking and near-storage computing (GPUs, FPGAs).

header:
  title: CloudSkin
  text: Adaptive virtualization for AI-enabled Cloud-edge Continuum
  button: Learn More
  buttonlink: "#calltoaction"

use_cases:
  title: "Use Cases"
  section: usecases
  rows:
    - columns:
      - title: Edge orchestration and video analytics
        subtitle: Orchestration of edge apps with matching cloud performance and the creation of AI video-analytics
        favicon: fa-video
      - title: Metabolomics
        subtitle: Edge/on-premise batch analytics and reduction of cloud offloading for Hybrid Metaspace
        favicon: fa-flask
    - columns:
      - title: Surgery
        subtitle: Real-time edge video analytics with dynamic resource allocation and Private Deep & Federated Learning at the edge
        favicon: fa-stethoscope
      - title: Agriculture IoT
        subtitle: Dynamic cloud offloading to match detail level and creation of an IoT-based agriculture data space
        favicon: fa-tractor

